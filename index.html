
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMART CLASSROOM QR SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 520px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px #00000012;
      text-align: center;
    }

    h2 { margin-top: 0; }

    .subtitle {
      color: #64748b;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.stop { background: #dc2626; }

    #reader {
      width: 100%;
      margin-top: 18px;
    }

    #result {
      margin-top: 18px;
      padding: 14px;
      background: #f1f5f9;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>SMART CLASSROOM QR</h2>
    <p class="subtitle">ระบบสแกน QR Code นักเรียน</p>

    <button onclick="startScanner()">📷 เปิดกล้องสแกน QR</button>
    <button class="stop" onclick="stopScanner()">ปิดกล้อง</button>

    <div id="reader"></div>

    <div id="result">
      กรุณากดเปิดกล้องเพื่อเริ่มสแกน
    </div>
  </div>
<script>
  let scanner = null;
  let isScanning = false;
  let isSending = false;

  function startScanner() {
    if (isScanning) return;

    document.getElementById("result").textContent =
      "กำลังเปิดกล้อง...";

    scanner = new Html5Qrcode("reader");

    scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },

      function(decodedText) {
        if (isSending) return;
        isSending = true;

        document.getElementById("result").textContent =
          "อ่าน QR สำเร็จ กำลังส่งข้อมูลกลับ...";

        scanner.stop().then(function() {
          isScanning = false;
          scanner.clear();

          if (window.opener && !window.opener.closed) {
            window.opener.postMessage(
              {
                type: "SMART_CLASSROOM_QR",
                qrToken: decodedText
              },
              "*"
            );

            document.getElementById("result").textContent =
              "ส่งรหัสกลับหน้าเช็คชื่อแล้ว สามารถปิดหน้านี้ได้";

            setTimeout(function() {
              window.close();
            }, 1200);

          } else {
            document.getElementById("result").textContent =
              "อ่าน QR ได้แล้ว แต่ไม่พบหน้า SMART CLASSROOM QR ที่เปิดหน้านี้";
          }

        }).catch(function(error) {
          isSending = false;
          document.getElementById("result").textContent =
            "หยุดกล้องไม่สำเร็จ: " + error;
        });
      },

      function(error) {
        // ไม่ต้องแสดงข้อความระหว่างค้นหา QR
      }

    ).then(function() {
      isScanning = true;
      document.getElementById("result").textContent =
        "กำลังสแกน QR Code...";
    }).catch(function(error) {
      document.getElementById("result").textContent =
        "เปิดกล้องไม่สำเร็จ: " + error;
    });
  }

  function stopScanner() {
    if (scanner && isScanning) {
      scanner.stop().then(function() {
        scanner.clear();
        isScanning = false;
        document.getElementById("result").textContent =
          "ปิดกล้องแล้ว";
      }).catch(function(error) {
        document.getElementById("result").textContent =
          "ปิดกล้องไม่สำเร็จ: " + error;
      });
    }
  }
</script>
</body>
</html>
