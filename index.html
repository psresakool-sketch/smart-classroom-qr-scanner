<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMART CLASSROOM QR SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 520px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px #00000012;
      text-align: center;
    }

    h2 { margin-top: 0; }

    .subtitle {
      color: #64748b;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.stop { background: #dc2626; }

    #reader {
      width: 100%;
      margin-top: 18px;
    }

    #result {
      margin-top: 18px;
      padding: 14px;
      background: #f1f5f9;
      border-radius: 10px;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>SMART CLASSROOM QR</h2>
    <p class="subtitle">ระบบสแกน QR Code / Barcode นักเรียน</p>

    <button onclick="startScanner()">📷 เปิดกล้องสแกน</button>
    <button class="stop" onclick="stopScanner()">ปิดกล้อง</button>

    <div id="reader"></div>

    <div id="result">
      กรุณากดเปิดกล้องเพื่อเริ่มสแกน
    </div>
  </div>

<script>

let scanner = null;
let isScanning = false;
let isSending = false;
let lastSentToken = "";
let lastSentAt = 0;
let pendingRequestId = null;
let responseTimeout = null;

const resultBox = document.getElementById("result");

function showResult(title, detail, success) {
  resultBox.replaceChildren();

  const heading = document.createElement("div");
  heading.textContent = title;
  heading.style.fontSize = "20px";
  heading.style.fontWeight = "bold";
  heading.style.marginBottom = "6px";

  const message = document.createElement("div");
  message.textContent = detail || "";
  message.style.whiteSpace = "pre-wrap";

  resultBox.style.color = success ? "#15803d" : "#dc2626";
  resultBox.appendChild(heading);
  resultBox.appendChild(message);
}

async function startScanner() {
  if (isScanning) return;

  if (typeof Html5Qrcode === "undefined") {
    resultBox.textContent =
      "โหลดระบบสแกนไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้าเว็บ";
    return;
  }

  resultBox.textContent = "กำลังเปิดกล้อง...";

  try {
    scanner = new Html5Qrcode("reader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.CODE_128
      ]
    });

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: function(viewWidth, viewHeight) {
          return {
            width: Math.min(viewWidth, 320),
            height: Math.min(viewHeight, 220)
          };
        }
      },
      handleScan,
      function(error) {}
    );

    isScanning = true;
    resultBox.textContent =
      "กล้องพร้อมใช้งาน — สแกนนักเรียนคนแรกได้เลย";

  } catch (error) {
    isScanning = false;

    try {
      if (scanner) await scanner.clear();
    } catch (_) {}

    scanner = null;
    resultBox.textContent =
      "เปิดกล้องไม่สำเร็จ: " + error;
  }
}

function handleScan(decodedText) {
  const token = String(decodedText || "").trim();

  if (!token || !isScanning || isSending) return;

  const now = Date.now();

  if (
    token === lastSentToken &&
    now - lastSentAt < 2500
  ) {
    return;
  }

  if (!window.opener || window.opener.closed) {
    resultBox.textContent =
      "ไม่พบหน้า SMART CLASSROOM ที่เปิด Scanner นี้ กรุณาเปิด Scanner จากหน้า Apps Script";
    return;
  }

  isSending = true;
  lastSentToken = token;
  lastSentAt = now;

  pendingRequestId =
    Date.now() + "-" + Math.random().toString(36).slice(2);

  resultBox.style.color = "#1d4ed8";
  resultBox.textContent =
    "กำลังบันทึกข้อมูล...\nกรุณารอผลยืนยันจาก Apps Script";

  try {
    window.opener.postMessage(
      {
        type: "SMART_CLASSROOM_QR",
        qrToken: token,
        requestId: pendingRequestId
      },
      "*"
    );

    // รอผลตอบกลับไม่เกิน 20 วินาที
    responseTimeout = setTimeout(function() {
      if (!pendingRequestId) return;

      showResult(
        "⚠ ยังไม่ได้รับผลยืนยัน",
        "กรุณาตรวจสอบหน้า Apps Script ก่อนสแกนรหัสนี้ซ้ำ",
        false
      );

      isSending = false;
      pendingRequestId = null;
      responseTimeout = null;

    }, 20000);

  } catch (error) {
    showResult(
      "✕ ส่งข้อมูลไม่สำเร็จ",
      String(error),
      false
    );

    isSending = false;
    pendingRequestId = null;
  }
}

// รับผลยืนยันจากหน้า Apps Script
window.addEventListener("message", function(event) {
  if (event.source !== window.opener) return;

  const allowedGoogleOrigin =
    event.origin === "https://script.google.com" ||
    event.origin === "https://script.googleusercontent.com" ||
    event.origin.endsWith(".googleusercontent.com");

  if (!allowedGoogleOrigin) return;

  const data = event.data;

  if (
    !data ||
    typeof data !== "object" ||
    data.type !== "SMART_CLASSROOM_QR_RESULT"
  ) return;

  if (
    !pendingRequestId ||
    data.requestId !== pendingRequestId
  ) return;

  if (responseTimeout) {
    clearTimeout(responseTimeout);
    responseTimeout = null;
  }

  if (data.success) {
    showResult(
      "✓ " + (data.title || "บันทึกสำเร็จ"),
      "นักเรียน: " + (data.studentName || "ไม่ระบุชื่อ") +
      "\n" + (data.message || ""),
      true
    );
  } else {
    showResult(
      "✕ " + (data.title || "บันทึกไม่สำเร็จ"),
      data.message || "เกิดข้อผิดพลาด",
      false
    );
  }

  isSending = false;
  pendingRequestId = null;
});

async function stopScanner() {
  if (!scanner || !isScanning) {
    resultBox.textContent = "กล้องปิดอยู่";
    return;
  }

  try {
    await scanner.stop();
    await scanner.clear();

    scanner = null;
    isScanning = false;
    isSending = false;
    pendingRequestId = null;

    if (responseTimeout) {
      clearTimeout(responseTimeout);
      responseTimeout = null;
    }

    resultBox.textContent = "ปิดกล้องแล้ว";

  } catch (error) {
    resultBox.textContent =
      "ปิดกล้องไม่สำเร็จ: " + error;
  }
}
</script>
</body>
</html>
